<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3eb" />
    <title>A cat and some tacos</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Trebuchet MS", sans-serif;
        background: #f7f3eb;
        color: #29251f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
      }

      main {
        width: min(100%, 38rem);
        display: grid;
        justify-items: center;
        gap: 1.5rem;
      }

      .cat {
        display: block;
        width: min(100%, 31rem);
        height: auto;
        overflow: visible;
      }

      .note {
        width: min(100%, 25rem);
        min-height: 3.75rem;
        padding: 0.9rem 1.1rem;
        border: 2px solid #29251f;
        border-radius: 0.85rem;
        background: #fffefa;
        color: inherit;
        font: 600 1.1rem/1.4 "Trebuchet MS", sans-serif;
        text-align: center;
        box-shadow: 4px 4px 0 #29251f;
      }

      .note:focus-visible {
        outline: 3px solid #e99658;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <svg
        class="cat"
        viewBox="0 0 420 390"
        role="img"
        aria-labelledby="cat-title"
        xmlns="http://www.w3.org/2000/svg"
      >
        <title id="cat-title">A big, happy orange cat</title>
        <ellipse cx="212" cy="359" rx="132" ry="17" fill="#e6ddce" />
        <path
          d="M296 282c66 7 83-39 62-68-10-14-31-16-42-5"
          fill="none"
          stroke="#c96f3c"
          stroke-linecap="round"
          stroke-width="23"
        />
        <path
          d="M296 282c66 7 83-39 62-68-10-14-31-16-42-5"
          fill="none"
          stroke="#e99658"
          stroke-linecap="round"
          stroke-width="16"
        />
        <path
          d="M106 204c-11 38-17 88-5 126 8 26 33 32 51 9l21-29h87l21 29c18 23 43 17 51-9 12-38 6-88-5-126Z"
          fill="#e99658"
          stroke="#29251f"
          stroke-linejoin="round"
          stroke-width="6"
        />
        <path
          d="m116 126 1-87 76 57m95 30-1-87-76 57"
          fill="#e99658"
          stroke="#29251f"
          stroke-linejoin="round"
          stroke-width="6"
        />
        <path d="m132 105-1-39 36 28m96 11 1-39-36 28" fill="#efb2a1" />
        <path
          d="M106 147c0-57 46-91 104-91s104 34 104 91-46 105-104 105-104-48-104-105Z"
          fill="#e99658"
          stroke="#29251f"
          stroke-width="6"
        />
        <path
          d="m151 76 18 32m100-32-18 32"
          fill="none"
          stroke="#c96f3c"
          stroke-linecap="round"
          stroke-width="9"
        />
        <ellipse cx="168" cy="151" rx="9" ry="13" fill="#29251f" />
        <ellipse cx="252" cy="151" rx="9" ry="13" fill="#29251f" />
        <path
          d="m201 174 10 8 10-8c0 12-4 18-10 18s-10-6-10-18Z"
          fill="#bd6b68"
          stroke="#29251f"
          stroke-linejoin="round"
          stroke-width="3"
        />
        <path
          d="M211 191c-8 12-19 12-27 4m27-4c8 12 19 12 27 4"
          fill="none"
          stroke="#29251f"
          stroke-linecap="round"
          stroke-width="4"
        />
        <path
          d="m154 179-41-7m43 19-43 5m169-17 41-7m-43 19 43 5"
          fill="none"
          stroke="#29251f"
          stroke-linecap="round"
          stroke-width="3"
        />
        <ellipse cx="158" cy="333" rx="26" ry="16" fill="#f3bd91" />
        <ellipse cx="264" cy="333" rx="26" ry="16" fill="#f3bd91" />
      </svg>
      <label class="sr-only" for="note">Your message</label>
      <input class="note" id="note" type="text" value="i like tacos - logtream" />
    </main>
    <style>
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </body>
</html>
